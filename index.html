<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 천체 방위각 내비게이터 v3.1 (완전 디버깅본)</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #dddddd; }
        #map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; }
        #map { width: 100%; height: 100%; }
        
        .mobile-ui-container { position: absolute; top: 0; left: 0; z-index: 9999; pointer-events: none; width: 100%; height: 100%; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .info-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 14px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); pointer-events: auto; max-width: 300px; width: 100%; }
        .card-title { font-weight: 700; font-size: 14px; color: #222; margin-bottom: 6px; }
        .data-text { font-size: 12px; color: #444; line-height: 1.6; }
        .auth-btn { display: block; width: 100%; background: #007aff; color: white; border: none; border-radius: 6px; padding: 9px 10px; font-weight: bold; font-size: 12px; margin-top: 10px; cursor: pointer; text-align: center; box-shadow: 0 2px 4px rgba(0,122,255,0.3); }
        .auth-btn:active { background: #0056b3; }
        .button-group { align-self: flex-end; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; margin-bottom: 24px; }
        .fab-button { width: 56px; height: 56px; background: #ffffff; border: none; border-radius: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; }
        .fab-button:active { background-color: #f0f0f0; }
        
        .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; margin-top: 4px; }
        .status-searching { background-color: #ff9500; }
        .status-success { background-color: #34c759; }
        .status-error { background-color: #ff3b30; }

        .arrow-marker {
            transition: transform 0.1s linear;
            transform-origin: center center;
        }
    </style>
</head>
<body>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <div class="mobile-ui-container">
        <div class="info-card">
            <div class="card-title">🧭 천체 방위각 내비게이터 (v3.1)</div>
            <div id="gps-status" class="status-badge status-searching">위치 수신 대기 중</div>
            <div id="gps-data" class="data-text" style="margin-top: 8px;">스마트폰 GPS 권한을 연동해 주세요.</div>
            <button class="auth-btn" onclick="requestGPSPermission()">🛰️ 위치 권한 강제 연동</button>
            <div class="data-text" style="margin-top: 10px; border-top: 1px dashed #ddd; padding-top: 8px;">
                <span style="font-size: 14px;">🔺</span> <b>빨간 화살표:</b> 진북 (0°)<br>
                <span style="font-size: 14px;">☀️</span> <b>파란 화살표:</b> 태양 방위 (실시간)
            </div>
        </div>
        <div class="button-group">
            <button class="fab-button" onclick="resetToUserLocation()">🎯</button>
            <button class="fab-button" onclick="toggleCompass()">🧭</button>
        </div>
    </div>

    <script src="https://unpkg.com"></script>
    <script>
        let map, userMarker, northMarker, sunMarker, accuracyCircle;
        let userLat = 35.8714, userLng = 128.6014; 
        let isCompassActive = false;
        let watchId = null;

        map = L.map('map', { zoomControl: false, trackResize: true, fadeAnimation: false }).setView([userLat, userLng], 16);
        L.tileLayer('https://google.com{x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);

        function fixMapSize() { if (map) { map.invalidateSize(); } }
        setInterval(fixMapSize, 2000);

        requestGPSPermission();

        function requestGPSPermission() {
            updateStatus("searching", "GPS 신호 강력 요청 중...");
            if (navigator.geolocation) {
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                navigator.geolocation.getCurrentPosition(onLocationUpdate, onLocationError, { enableHighAccuracy: true, timeout: 10000 });
                watchId = navigator.geolocation.watchPosition(onLocationUpdate, onLocationError, { enableHighAccuracy: true, maximumAge: 0 });
            } else { updateStatus("error", "GPS 미지원"); }
        }

        function onLocationUpdate(pos) {
            userLat = Number(pos.coords.latitude);
            userLng = Number(pos.coords.longitude);
            updateStatus("success", "GPS 연동 성공 🟢");
            map.setView([userLat, userLng], 17);
            fixMapSize();
            drawNavigationMarkers();
        }

        function onLocationError(err) {
            let msg = "GPS 신호 없음";
            if(err.code === 1) msg = "위치 권한 거부됨 🔴";
            updateStatus("error", msg); 
            drawNavigationMarkers();
            fixMapSize();
        }

        function updateStatus(type, text) {
            const badge = document.getElementById('gps-status');
            badge.className = "status-badge status-" + type; 
            badge.innerText = text;
        }

        function drawNavigationMarkers() {
            if (userMarker) map.removeLayer(userMarker);
            if (northMarker) map.removeLayer(northMarker);
            if (sunMarker) map.removeLayer(sunMarker);
            if (accuracyCircle) map.removeLayer(accuracyCircle);

            userMarker = L.marker([userLat, userLng]).addTo(map);
            accuracyCircle = L.circle([userLat, userLng], { radius: 60, color: '#007aff', fillColor: '#007aff', fillOpacity: 0.08, weight: 1 }).addTo(map);

            const time = new Date();
            const decimalHours = time.getHours() + time.getMinutes() / 60;
            let sunAzimuth = (decimalHours - 12) * 15 + 180;
            if (sunAzimuth < 0) sunAzimuth += 360;
            if (sunAzimuth >= 360) sunAzimuth -= 360;

            document.getElementById('gps-data').innerHTML = `<b>위도:</b> ${userLat.toFixed(5)}°<br><b>경도:</b> ${userLng.toFixed(5)}°<br><b>태양 방위각:</b> ${sunAzimuth.toFixed(1)}°`;

            // [수정 완결] iconSize 규격을 [60, 60] 및 [80, 80] 배열로 정밀 삽입하여 브라우저 가독성 오류 전면 제거
            const northHtml = `<div class="arrow-marker" style="transform: rotate(0deg); width:60px; height:60px; display:flex; justify-content:center; align-items:center;"><span style="color:#ff3b30; font-size:32px; font-weight:bold; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));">▲</span></div>`;
            const northIcon = L.divIcon({ html: northHtml, className: '', iconSize:, iconAnchor: [30, 30] });
            northMarker = L.marker([userLat, userLng], { icon: northIcon }).addTo(map);

            const sunHtml = `<div class="arrow-marker" style="transform: rotate(${sunAzimuth}deg); width:80px; height:80px; display:flex; flex-direction:column; justify-content:flex-start; align-items:center;"><span style="color:#007aff; font-size:36px; font-weight:bold; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));">↑</span><span style="font-size:14px; margin-top:-5px;">☀️</span></div>`;
            const sunIcon = L.divIcon({ html: sunHtml, className: '', iconSize:, iconAnchor: [40, 40] });
            sunMarker = L.marker([userLat, userLng], { icon: sunIcon }).addTo(map);
        }

        function resetToUserLocation() { map.setView([userLat, userLng], 17); fixMapSize(); drawNavigationMarkers(); }

        function toggleCompass() {
            if (isCompassActive) {
                window.removeEventListener('deviceorientation', handleOrientation);
                window.removeEventListener('deviceorientationabsolute', handleOrientation);
                document.getElementById('map').style.transform = "none"; isCompassActive = false;
            } else {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(response => { if (response === 'granted') startCompassListening(); }).catch(console.error);
                } else { startCompassListening(); }
            }
        }

        function startCompassListening() {
            if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', handleOrientation);
            else if ('ondeviceorientation' in window) window.addEventListener('deviceorientation', handleOrientation);
            isCompassActive = true;
        }

        function handleOrientation(event) {
            let heading = event.alpha;
            if (event.webkitCompassHeading) heading = event.webkitCompassHeading;
            else if (event.absolute === true || event.absolute === undefined) heading = 360 - event.alpha;
            if (heading !== undefined && heading !== null) document.getElementById('map').style.transform = `rotate(${-heading}deg)`;
        }
    </script>
</body>
</html>
